<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#282a36"/>
  
  <!-- Terminal/Code brackets -->
  <g fill="none" stroke="#50fa7b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left bracket -->
    <path d="M 20 25 L 15 35 L 20 45"/>
    <!-- Right bracket -->
    <path d="M 80 25 L 85 35 L 80 45"/>
  </g>
  
  <!-- Code symbols in center -->
  <text x="50" y="55" font-family="monospace" font-size="32" font-weight="bold" fill="#50fa7b" text-anchor="middle" letter-spacing="2">
    &lt; /&gt;
  </text>
  
  <!-- Accent dots -->
  <circle cx="25" cy="70" r="2" fill="#50fa7b"/>
  <circle cx="75" cy="70" r="2" fill="#50fa7b"/>
  <circle cx="50" cy="80" r="2" fill="#50fa7b"/>
</svg>
